name: Release desktop builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Determine version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build:linux
      - name: Create download names (stable + versioned)
        run: |
          set -euo pipefail
          pick() {
            local pattern="$1" label="$2"
            local matches=( $pattern )
            if [ ${#matches[@]} -ne 1 ]; then
              echo "::error::Expected exactly one match for ${label}, got ${#matches[@]}: ${matches[*]}"
              exit 1
            fi
            echo "${matches[0]}"
          }
          APPIMAGE="$(pick 'dist/*.AppImage' 'Linux AppImage')"
          DEB="$(pick 'dist/*.deb' 'Linux .deb')"
          cp "$APPIMAGE" "dist/Hiiscript-latest-linux.AppImage"
          cp "$APPIMAGE" "dist/hiiscript-linux-${VERSION}.AppImage"
          cp "$DEB"      "dist/Hiiscript-latest-linux.deb"
          cp "$DEB"      "dist/hiiscript-linux-${VERSION}.deb"
          ls -la dist/
                - name: List dist contents
        run: ls -la dist/ || ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/Hiiscript-latest-linux.*
            dist/hiiscript-linux-v*.*

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Determine version
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Configure code signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$CSC_LINK" ]]; then
            echo "Code signing credentials provided"
          else
            echo "Unsigned build: configure WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD for trusted Windows releases"
          fi
      - run: npm ci
      - run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Create download names (stable + versioned)
        shell: bash
        run: |
          set -euo pipefail
          pick() {
            local pattern="$1" label="$2"
            local matches=( $pattern )
            if [ ${#matches[@]} -ne 1 ]; then
              echo "::error::Expected exactly one match for ${label}, got ${#matches[@]}: ${matches[*]}"
              exit 1
            fi
            echo "${matches[0]}"
          }
          PORTABLE="$(pick 'dist/*portable*.exe' 'Windows portable')"
          SETUP="$(pick 'dist/*setup*.exe' 'Windows installer')"
          cp "$PORTABLE" "dist/Hiiscript-latest-windows-portable.exe"
          cp "$PORTABLE" "dist/hiiscript-windows-portable-${VERSION}.exe"
          cp "$SETUP"    "dist/Hiiscript-latest-windows-setup.exe"
          cp "$SETUP"    "dist/hiiscript-windows-setup-${VERSION}.exe"
          ls -la dist/
                - name: List dist contents
        run: ls -la dist/ || ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/Hiiscript-latest-windows-*.exe
            dist/hiiscript-windows-*-v*.*.*

  build-android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Determine version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run android:add
      - run: npm run android:build
      - name: Create download names (stable + versioned)
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          cp "$APK" "Hiiscript-latest-android.apk"
          cp "$APK" "hiiscript-android-${VERSION}.apk"
          ls -la *.apk
                - name: List dist contents
        run: ls -la dist/ || ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            Hiiscript-latest-android.apk
            hiiscript-android-v*.*.*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Package release assets
        run: |
          mkdir publish
          cp release/linux-builds/Hiiscript-latest-linux.AppImage publish/
          cp release/linux-builds/Hiiscript-latest-linux.deb      publish/
          cp release/linux-builds/hiiscript-linux-v*.AppImage     publish/
          cp release/linux-builds/hiiscript-linux-v*.deb          publish/
          cp release/windows-builds/Hiiscript-latest-windows-portable.exe publish/
          cp release/windows-builds/Hiiscript-latest-windows-setup.exe    publish/
          cp release/windows-builds/hiiscript-windows-portable-v*.exe     publish/
          cp release/windows-builds/hiiscript-windows-setup-v*.exe        publish/
          cp release/android-builds/Hiiscript-latest-android.apk          publish/
          cp release/android-builds/hiiscript-android-v*.apk              publish/
          echo "Published assets:"
          ls -la publish/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/releases/1.0.11.md
          files: publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}