name: Release desktop builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:linux
      - name: Create stable download names
        run: |
          cp dist/*.AppImage dist/Hiiscript-latest-linux.AppImage
          cp dist/*.deb dist/Hiiscript-latest-linux.deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-builds
          path: |
            dist/Hiiscript-latest-linux.AppImage
            dist/Hiiscript-latest-linux.deb

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure code signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$CSC_LINK" ]]; then echo "Code signing credentials provided"; else echo "Unsigned build: configure WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD for trusted Windows releases"; fi
      - run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Create stable download names
        shell: bash
        run: |
          cp dist/*portable*.exe dist/Hiiscript-latest-windows-portable.exe
          cp dist/*setup*.exe dist/Hiiscript-latest-windows-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-builds
          path: |
            dist/Hiiscript-latest-windows-portable.exe
            dist/Hiiscript-latest-windows-setup.exe

  build-android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: npm run android:add
      - run: npm run android:build
      - name: Create stable download name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hiiscript-latest-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-builds
          path: Hiiscript-latest-android.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Package release assets
        run: |
          mkdir publish
          cp release/linux-builds/Hiiscript-latest-linux.AppImage publish/
          cp release/linux-builds/Hiiscript-latest-linux.deb publish/
          cp release/windows-builds/Hiiscript-latest-windows-portable.exe publish/
          cp release/windows-builds/Hiiscript-latest-windows-setup.exe publish/
          cp release/android-builds/Hiiscript-latest-android.apk publish/
          test "$(find publish -maxdepth 1 -type f | wc -l)" -eq 5
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/releases/1.0.2.md
          files: publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
